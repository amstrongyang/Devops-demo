spring:
  application:
    name: order-service-cicd-demo
  profiles:
    default: dev

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Order API for CI/CD practice
